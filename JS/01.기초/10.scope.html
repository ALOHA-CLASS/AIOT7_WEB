<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scope</title>
    <script>
        /*
            Scope (스코프)
            : 변수에 접근할 수 있는 범위
            - 전역 범위
            - 함수 범위
            - 블록 범위 : var ❌, let ⭕
        */
       /*
            Hoisting (호이스팅)
            : 선언한 변수를 범위 내에서 코드의 맨 위로 끌어올리는 동작
            * JavaSCript 에서는 코드를 실행하기 전에
              var 변수 선언, 선언적 함수 등을 호이스팅 합니다.
        */

        // 전역범위

        // * 함수를 정의하는 방법
        // function 함수 (매개변수) {   }
        function test() {
            // 함수범위
            console.log("test() 시작");

            console.log(`local : ${local}`);
            var local = 10

            // var 는 블록{ } scope 를 지원하지 않는다.
            if( local > 0 ) {
                var local = 20
                console.log(`local : ${local}`);  // 같은 함수 스코프의 변수, 새로운 변수 아님
            }
            console.log(`local : ${local}`);
            
            console.log("test() 끝");
        }

        // 함수 호출
        test()

        function test2() {
            // 함수범위
            console.log("test2() 시작");

            // console.log(`local2 : ${local2}`);   // let 은 호이스팅 안되니까 에러 발생!
            let local2 = 10

            // let 는 블록{ } scope 를 지원한다.
            if( local2 > 0 ) {
                let local2 = 20
                console.log(`local2 : ${local2}`);  // 함수범위의 local2 와 다른 변수이다.
            }
            console.log(`local2 : ${local2}`);
            
            console.log("test2() 끝");
        }

        // 함수호출
        test2()


        /* 
            var, let 각각 호이스팅 적용됨
            * let 은 호이스팅 되지만, 값이 초기화되지 않으면 접근 불가(에러)
            * var 는 호이스팅도 되고, 값도 접근할 수 있지만 undefiened
            ✅ 호이스팅은 선언이 끌어올려지는 것이지 초기화가 끌어올려지는 것은 아니다.
            ✅ let 은 블록 스코프를 지원하고, var 는 지원하지 않는다.
        */

        console.log(test3);
        console.log(test4);

        var test3 = 'test'
        let test4 = 'test'
        
    </script>
</head>
<body>
    
</body>
</html>
